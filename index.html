<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/brand/shivdev-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- No static <meta name="description"> here on purpose: every
         route already renders its own <SEO> component (see
         src/seo/SEO.jsx), which sets a page-specific description via
         react-helmet-async — including this exact same text as the
         fallback for any page that doesn't pass its own (see
         data/site.js's seo.defaultDescription). A static tag here
         would sit ALONGSIDE Helmet's, not replace it — Helmet only
         manages tags it renders itself, so a duplicate name="description"
         already in the static HTML doesn't get removed. The result:
         two competing <meta name="description"> tags per page, with
         crawlers/tools reading document order likely picking this
         static, non-page-specific one over the intended per-page
         text (this genuinely happened during a production audit —
         every route showed the same description despite each page
         passing its own). -->
    <meta name="theme-color" content="#0a1428" />
    <!-- The hero video's poster is the page's LCP candidate, but as a
         client-rendered SPA there's no server HTML for it to appear
         in until React mounts — this preload hint is what actually
         makes the browser start fetching it immediately, in parallel
         with JS downloading/parsing, instead of only after Home's
         component tree renders the <video> element. Path must match
         HeroVideo's poster prop in pages/Home/index.jsx exactly. -->
    <link rel="preload" as="image" href="/videos/car-poster.jpg" fetchpriority="high" />
    <title>Shivdev Holidays — Cab & Travel Planning in Kanyakumari</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: Arial, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; color: #10243d">
        <strong>Shivdev Holidays</strong> — cab &amp; travel planning in Kanyakumari.<br />
        This website needs JavaScript to show its pages. To book a cab or plan a trip, call
        <a href="tel:+919072300823">+91 90723 00823</a> or message us on
        <a href="https://wa.me/919072300823">WhatsApp</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
